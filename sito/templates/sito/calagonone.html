{% extends "../sito/base.html" %} {% load static %} {%block content%}
<div class="relative">
    <img
        class="absolute object-cover bg-cover bg-center blur-lg brightness-90 h-full inset-0 w-full"
        src="{% static '' %}sito/sea_bg.jpg"
        style="object-fit: fill; z-index: -10"
    />
    <div class="container mx-auto px-4 lg:max-w-7xl">
        <div class="grid grid-cols-1 bg-white shadow-lg gap-8">
            <div class="px-6 lg:px-20 py-4">
                <h1
                    class="text-black text-3xl font-bold font-[Courgette] mb-6"
                    id="location-directions"
                >
                    <span
                        class="text-xl inline-flex items-center justify-center w-7 h-7 rounded-full bg-{{ secondary_col }} font-bold text-{{ secondary_col }}"
                    >
                        .
                    </span>
                    {{labels.where_are_we}}
                </h1>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4153.993020868887!2d9.625948581771791!3d40.28568967254134!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12def42637a344d7%3A0x8114c1df60c1be9c!2sLa%20Bouganville%20Apartments!5e1!3m2!1sen!2sit!4v1777996488921!5m2!1sen!2sit"
                    class="w-full aspect-square md:aspect-video rounded-md mb-6"
                    style="border: 0"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
                <details
                    class="group [&_summary::-webkit-details-marker]:hidden mb-6"
                >
                    <summary
                        class="flex items-center cursor-pointer list-none select-none"
                    >
                        <span
                            class="mr-4 text-{{ secondary_col }} transition-transform duration-300 group-open:rotate-180"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-7 h-7"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="3"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M19 9l-7 7-7-7"
                                />
                            </svg>
                        </span>

                        <h1
                            class="text-black text-2xl font-bold font-[Courgette]"
                        >
                            {{ street_directions.title }}
                        </h1>
                    </summary>

                    <p class="mt-4 pl-11 text-gray-700 leading-relaxed font-[{{conf.p_font}}]">
                        {{ street_directions.descr|safe }}
                    </p>
                </details>
            </div>
        </div>
    </div>
</div>
{%endblock%}
